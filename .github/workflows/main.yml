name: STM32 CubeIDE Build and Analysis Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # This new job runs a static analysis check
  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4 # Use a more recent version of checkout

      - name: Install Cppcheck
        run: sudo apt-get update && sudo apt-get install -y cppcheck

      - name: Run Cppcheck
        # This command checks source/header files in common CubeIDE folders
        # --error-exitcode=1 makes the job fail if Cppcheck finds an error
        # --suppress=missingIncludeSystem prevents errors about missing standard headers
        run: |
          cppcheck --enable=all --suppress=missingIncludeSystem --error-exitcode=1 Core/Src Core/Inc Drivers/STM32F4xx_HAL_Driver

  # Your existing build job
  build:
    runs-on: ubuntu-latest
    # Optional: If you want the build to run ONLY if static analysis passes, add this line:
    # needs: static-analysis 
    steps:
      - name: Checkout code
        uses: actions/checkout@v4 # Use a more recent version of checkout

      - name: Set up ARM toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi

      - name: Build STM32 CubeIDE project
        run: |
          cd Debug
          make -j$(nproc)

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: Debug/*.elf # Use a wildcard to capture the correct .elf file
